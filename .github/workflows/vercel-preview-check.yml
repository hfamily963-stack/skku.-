name: Vercel Preview Check

on:
  push:
    branches: [foundry-test-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose deployed preview over public internet
        env:
          PREVIEW_URL: https://foundry-test-v01-neuopr58p-jeawook.vercel.app
        run: |
          CODE=$(curl -L -sS -D /tmp/headers.txt -o /tmp/home.html -w '%{http_code}' "$PREVIEW_URL/" || true)
          echo "status=$CODE bytes=$(wc -c </tmp/home.html 2>/dev/null || echo 0)"
          echo '--- response headers ---'
          sed -n '1,40p' /tmp/headers.txt
          echo '--- title ---'
          grep -o -m1 '<title[^>]*>[^<]*</title>' /tmp/home.html || true
          echo '--- marker scan ---'
          if grep -q 'AI IDEA VALIDATION PLATFORM' /tmp/home.html; then echo 'FOUND=FOUNDRY_APP'; exit 0; fi
          if grep -qi 'Vercel Authentication\|Deployment Protection\|Log in to Vercel\|Sign in to Vercel' /tmp/home.html; then echo 'FOUND=VERCEL_PROTECTION'; exit 0; fi
          echo 'FOUND=UNKNOWN_200_RESPONSE'
          head -c 800 /tmp/home.html | tr '\n' ' '
          exit 1
