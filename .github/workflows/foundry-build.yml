name: Foundry Test Build

on:
  push:
    branches: [foundry-test-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Foundry source
        run: node unpack.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize package versions
        run: |
          npm pkg set dependencies.next=16.3.3
          npm pkg set devDependencies.eslint-config-next=16.3.3
          npm pkg set devDependencies.typescript=5.7.3
      - name: Install dependencies
        timeout-minutes: 4
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Next.js build
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          FOUNDRY_DEMO_MODE: 'false'
        run: npm run build
      - name: Runtime smoke test on port 3000
        timeout-minutes: 2
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          FOUNDRY_DEMO_MODE: 'false'
        run: |
          npm start > /tmp/foundry-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then OK=1; break; fi
            sleep 1
          done
          test "$OK" = "1"
          test -s /tmp/home.html
          grep -q 'AI IDEA VALIDATION PLATFORM' /tmp/home.html
          curl -fsS http://127.0.0.1:3000/login >/tmp/login.html
          grep -q 'FOUNDRY TEST' /tmp/login.html
          curl -fsS http://127.0.0.1:3000/purchase >/tmp/purchase.html
          echo '--- Foundry runtime log ---'
          cat /tmp/foundry-next.log
