name: Vercel Live3 Diagnose

on:
  push:
    branches: [foundry-test-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Foundry live3 URLs
        env:
          STABLE_URL: https://foundry-test-v01-live3-jeawook.vercel.app
          DEPLOY_URL: https://foundry-test-v01-live3-ji31p1egi-jeawook.vercel.app
        run: |
          for i in $(seq 1 36); do
            CODE=$(curl -L -sS -D /tmp/hs.txt -o /tmp/bs.html -w '%{http_code}' "$STABLE_URL/" || true)
            echo "stable attempt=$i status=$CODE bytes=$(wc -c </tmp/bs.html 2>/dev/null || echo 0)"
            if grep -qi 'Vercel Authentication\|Deployment Protection\|Log in to Vercel\|Sign in to Vercel' /tmp/bs.html; then echo 'STABLE=VERCEL_PROTECTION'; exit 0; fi
            if grep -q 'AI IDEA VALIDATION PLATFORM' /tmp/bs.html; then echo 'STABLE=FOUNDRY_APP'; exit 0; fi
            sleep 5
          done
          echo '--- stable headers ---'; grep -i -E '^(HTTP/|location:|x-vercel-error:|server:)' /tmp/hs.txt | head -30 || true
          echo '--- unique deployment ---'
          CODE2=$(curl -L -sS -D /tmp/hd.txt -o /tmp/bd.html -w '%{http_code}' "$DEPLOY_URL/" || true)
          echo "unique status=$CODE2 bytes=$(wc -c </tmp/bd.html 2>/dev/null || echo 0)"
          grep -i -E '^(HTTP/|location:|x-vercel-error:|server:)' /tmp/hd.txt | head -30 || true
          grep -o -m1 '<title[^>]*>[^<]*</title>' /tmp/bd.html || true
          exit 1
