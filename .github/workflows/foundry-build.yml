name: Foundry Test Build

on:
  push:
    branches: [foundry-test-v01]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack Foundry source
        run: node unpack.mjs
      - name: Install dependencies
        run: npm install
      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          FOUNDRY_DEMO_MODE: 'false'
        run: npm run build
