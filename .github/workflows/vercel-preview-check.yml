name: Vercel Public Deployment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Foundry public deployment
        env:
          PUBLIC_URL: https://foundry-test-v01-live3-jeawook.vercel.app
        run: |
          CODE=$(curl -L -sS -D /tmp/headers.txt -o /tmp/home.html -w '%{http_code}' "$PUBLIC_URL/" || true)
          echo "status=$CODE bytes=$(wc -c </tmp/home.html 2>/dev/null || echo 0)"
          if grep -q 'AI IDEA VALIDATION PLATFORM' /tmp/home.html; then echo 'FOUNDRY_APP_PUBLIC'; exit 0; fi
          if grep -qi 'Vercel Authentication\|Deployment Protection\|Log in to Vercel\|Sign in to Vercel' /tmp/home.html; then echo 'VERCEL_PROTECTION_ENABLED'; exit 2; fi
          sed -n '1,30p' /tmp/headers.txt
          exit 1
