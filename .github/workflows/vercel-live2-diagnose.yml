name: Vercel Live3 Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Foundry live3 URLs
        env:
          STABLE_URL: https://foundry-test-v01-live3-jeawook.vercel.app
          DEPLOY_URL: https://foundry-test-v01-live3-ji31p1egi-jeawook.vercel.app
        run: |
          for URL in "$STABLE_URL" "$DEPLOY_URL"; do
            echo "=== $URL ==="
            CODE=$(curl -L -sS -D /tmp/h.txt -o /tmp/b.html -w '%{http_code}' "$URL/" || true)
            echo "status=$CODE bytes=$(wc -c </tmp/b.html 2>/dev/null || echo 0)"
            grep -i -E '^(HTTP/|location:|x-vercel-error:|server:)' /tmp/h.txt | head -20 || true
            grep -o -m1 '<title[^>]*>[^<]*</title>' /tmp/b.html || true
          done
