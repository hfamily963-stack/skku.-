name: Foundry Test Build

on:
  push:
    branches: [foundry-test-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Foundry source
        run: node unpack.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize package versions
        run: |
          npm pkg set dependencies.next=16.3.3
          npm pkg set devDependencies.eslint-config-next=16.3.3
          npm pkg set devDependencies.typescript=5.7.3
      - name: Install dependencies
        timeout-minutes: 4
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Next.js build
        timeout-minutes: 5
        run: npm run build
      - name: Runtime smoke test on port 3000
        timeout-minutes: 2
        run: |
          npm start > /tmp/foundry-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then break; fi
            sleep 1
          done
          grep -q 'Foundry' /tmp/home.html
          curl -fsS http://127.0.0.1:3000/login >/tmp/login.html
          grep -q '로그인\|Foundry' /tmp/login.html
          DASH=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard)
          test "$DASH" = "307" -o "$DASH" = "302" -o "$DASH" = "303"
          BP=$(curl -sS -o /tmp/bp.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"idea":"runtime smoke test"}' http://127.0.0.1:3000/api/blueprint)
          test "$BP" = "401"
          echo '--- Foundry runtime log ---'
          cat /tmp/foundry-next.log
